[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meiwatermark"
version = "0.1.0"
description = "A local desktop tool for batch image watermarks"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "MeiWatermark contributors" }]
dependencies = ["Pillow>=11,<13", "PySide6>=6.8,<7"]

[project.scripts]
meiwatermark = "meiwatermark.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
meiwatermark = ["assets/*.png"]

[tool.ruff]
line-length = 100
target-version = "py312"
